; F1 Lamp – standalone firmware (FastLED + ESPAsyncWebServer, no WLED)
[platformio]
default_envs = esp32c3_f1lamp
extra_configs = platformio_override.ini

[env:esp32c3_f1lamp]
platform         = espressif32
board            = esp32-c3-devkitm-1
framework        = arduino
monitor_speed    = 115200
upload_speed     = 921600
board_build.filesystem = littlefs

; LED_PIN  : GPIO connected to WS2812B data line  (default 8 for ESP32-C3)
; MAX_LEDS : compile-time array limit; actual count set at runtime via web UI
build_flags =
    -DLED_PIN=2
    -DMAX_LEDS=60
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -march=rv32imc_zicsr_zifencei
    -I../mbedtls/library
    -DMBEDTLS_USER_CONFIG_FILE=\"mbedtls_ssl_enable.h\"
    ; AsyncTCP tuning for ESP32-C3 (single-core, limited sockets)
    ; Increase ACK timeout so slow TLS ops don't trigger RST
    -DCONFIG_ASYNC_TCP_MAX_ACK_TIME=5000
    ; Keep the async TCP task on the same (only) core
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=1
    ; Larger receive buffer reduces retransmits during heavy page loads
    -DCONFIG_ASYNC_TCP_QUEUE_SIZE=128

lib_deps =
    fastled/FastLED
    https://github.com/me-no-dev/AsyncTCP.git
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    bblanchon/ArduinoJson @ ^7.3.0