<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>F1 Lamp</title>
<link rel="stylesheet" href="/common.css?v=20260906c">
</head><body>
<div id="header"></div>
<div id="navBar"></div>

<!-- status -->
<div class="card">
  <h2>Track Status</h2>
  <div class="state-box" id="stateBox">Loading…</div>
  <div class="info-row"><span>F1 LiveTiming</span><span style="display:flex;align-items:center;gap:8px"><span id="f1Ok">—</span><button id="f1ReconnBtn" onclick="f1Reconnect()" style="display:none;font-size:.7rem;padding:2px 8px;background:#333;color:#ccc;border:1px solid #555;border-radius:4px;cursor:pointer">Reconnect</button></span></div>
  <div class="info-row" id="raceRow" style="display:none"><span>Race Week</span><span id="raceLabel" style="color:#ffc800">—</span></div>
  <div class="info-row" id="rampRow" style="display:none"><span>Idle ramp</span><span id="rampPct">—</span></div>
  <div id="effDetail" onclick="location.href='/effects.html'" role="button" title="Open the Effects page"
       style="margin-top:10px;padding:10px;background:#222;border-radius:8px;display:none;cursor:pointer">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <div style="font-size:.65rem;text-transform:uppercase;letter-spacing:1px;color:#555">Current Effect</div>
      <span style="font-size:.62rem;color:#00d2be">Edit &#8250;</span>
    </div>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:6px">
      <span id="effName" style="font-size:.9rem;font-weight:700;color:#ccc"></span>
      <div style="display:flex;gap:3px;align-items:center">
        <div id="effSwatch" style="width:30px;height:22px;border-radius:4px;border:1px solid #444"></div>
        <div id="effSwatch2" style="width:30px;height:22px;border-radius:4px;border:1px solid #444;display:none"></div>
      </div>
      <span id="effTag" style="font-size:.65rem;padding:2px 6px;border-radius:10px;display:none"></span>
    </div>
  </div>
</div>

<!-- brightness -->
<div class="card">
  <h2>Brightness</h2>
  <div class="row">
    <input type="range" min="1" max="255" id="briSlider" oninput="onBri(this.value)" style="flex:1">
    <span id="briVal" style="font-size:.85rem;color:#888;width:28px;text-align:right">128</span>
  </div>
</div>

<!-- next race weekend schedule -->
<div class="card" id="nextRaceCard" style="display:none">
  <h2 id="nrTitle">Next Race Weekend</h2>
  <div id="nrMeta" style="margin-bottom:10px;font-size:.82rem;color:#888"></div>
  <div id="nrSessions"></div>
  <div id="nrError" style="color:#e10600;font-size:.85rem;display:none"></div>
</div>

<!-- live session events -->
<div class="card" id="eventsCard" style="display:none">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
    <h2 style="margin:0">Live Session Events</h2>
    <div style="display:flex;align-items:center;gap:8px">
      <span id="evLive" style="font-size:.7rem;padding:2px 8px;border-radius:10px;display:none">● LIVE</span>
      <button class="btn btn-outline btn-sm" onclick="clearEvents()" style="font-size:.7rem;padding:2px 8px">Clear</button>
    </div>
  </div>
  <div id="evStatus" style="font-size:.78rem;color:#666;margin-bottom:8px"></div>
  <div id="evList" style="max-height:680px;overflow-y:auto"></div>
  <div id="evEmpty" style="color:#555;font-size:.85rem;display:none">No events yet</div>
</div>

<script src="/common.js?v=20260906c"></script>
<script>
buildHeader();
buildNav('home');

let briTimer=null;
function onBri(v){
  document.getElementById('briVal').textContent=v;
  clearTimeout(briTimer);
  briTimer=setTimeout(()=>fetch('/api/bri?v='+v,{method:'POST'}),200);
}
async function f1Reconnect(){
  const btn=document.getElementById('f1ReconnBtn');
  btn.disabled=true; btn.textContent='…';
  await fetch('/api/f1reconnect');
  setTimeout(()=>{btn.disabled=false; btn.textContent='Reconnect';},3000);
}

function onStatus(d){
  const idx=Math.min(d.state,SN.length-1);
  const b=SB[idx]||'#333', f=SF[idx]||'#eee';
  const sb=document.getElementById('stateBox');
  sb.textContent=SN[idx]||'Unknown';
  sb.style.background=b; sb.style.color=f;
  if(d.f1ok && d.sessionActive){
    document.getElementById('f1Ok').textContent='● Live Session';
    document.getElementById('f1Ok').style.color='#00c800';
    document.getElementById('f1ReconnBtn').style.display='none';
  } else if(d.f1ok){
    document.getElementById('f1Ok').textContent='✓ Connected';
    document.getElementById('f1Ok').style.color='#00d2be';
    document.getElementById('f1ReconnBtn').style.display='none';
  } else {
    const phase=d.f1phase||'';
    let msg='⏳ Waiting…';
    if(phase==='wifi')           msg='⏳ No WiFi';
    else if(phase==='cal')       msg='⏳ Fetching calendar…';
    else if(phase==='sess')      msg='⏳ Fetching sessions…';
    else if(phase==='connecting')msg='⏳ Connecting to F1…';
    else if(phase==='wait')      msg='⏳ Reconnecting…';
    else if(d.ssid && !d.ap)     msg='⏳ Connecting…';
    document.getElementById('f1Ok').textContent=msg;
    document.getElementById('f1Ok').style.color='#aaa';
    /* Show reconnect button only when in backoff wait (not wifi/AP-only) */
    const showBtn = phase==='wait'||phase==='connecting';
    document.getElementById('f1ReconnBtn').style.display=showBtn?'inline-block':'none';
  }
  document.getElementById('briSlider').value=d.bri;
  document.getElementById('briVal').textContent=d.bri;
  const hasRace=d.nextRace&&d.nextRace!=='—';
  document.getElementById('raceRow').style.display=hasRace?'flex':'none';
  document.getElementById('raceLabel').textContent=d.nextRace||'';
  const hasRamp=d.rampPct>0&&d.rampPct<100;
  document.getElementById('rampRow').style.display=hasRamp?'flex':'none';
  document.getElementById('rampPct').textContent=hasRamp?(d.rampPct+'%'):'';
  /* update session-active flag and re-render session list only when it changes */
  const _prevActive = _sessionActive;
  _sessionActive = !!d.sessionActive;
  if(_sessionActive !== _prevActive) renderNextRaceSessions();
  /* effect detail */
  const ep=document.getElementById('effDetail');
  if(d.eff){
    ep.style.display='block';
    /* Label with the state ACTUALLY shown on the LEDs ("shown" = last
       applied, i.e. after the configured event delay), falling back to the
       live state.  Not the LED engine effect type (Solid/Pulse/...). */
    const shownSt=(typeof d.shown==='number')?d.shown:d.state;
    const stIdx=Math.min(shownSt,SN.length-1);
    document.getElementById('effName').textContent=SN[stIdx]||('State '+shownSt);
    document.getElementById('effSwatch').style.background=rgb2hex(d.eff.r,d.eff.g,d.eff.b);
    const s2=document.getElementById('effSwatch2');
    if(d.eff.e===4){
      s2.style.display='inline-block';
      s2.style.background=rgb2hex(d.eff.r2,d.eff.g2,d.eff.b2);
    }else{s2.style.display='none';}
  }else{ep.style.display='none';}
}


/* ── Next Race Weekend ──────────────────────────────────────────────── */
let _nrData = null;
let _sessionActive = false;

/* Max session duration (ms) used to decide whether a session already ended */
function sessMaxDuration(name){
  if(name==='Race') return 3*3600000;
  if(name.includes('Qual')) return 90*60000;
  if(name==='Sprint') return 45*60000;
  return 90*60000; /* FP1/FP2/FP3 */
}

function applyNextRace(d){
  _nrData=d;
  const card=document.getElementById('nextRaceCard');
  if(!d.raceName){card.style.display='none';return;}
  card.style.display='block';
  document.getElementById('nrTitle').textContent=d.raceName;
  let meta='';
  if(d.circuit) meta+=d.circuit;
  if(d.locality) meta+=' — '+d.locality;
  if(d.country) meta+=', '+d.country;
  if(d.round) meta+=' (Round '+d.round+')';
  if(d.sessions&&d.sessions.length) meta+=' — '+d.sessions.length+' sessions';
  document.getElementById('nrMeta').textContent=meta;
  renderNextRaceSessions();
}

function renderNextRaceSessions(){
  if(!_nrData||!_nrData.sessions||!_nrData.sessions.length) return;
  const cont=document.getElementById('nrSessions');
  if(!cont) return;
  const now=new Date();
  /* Always show the weekend in chronological order, starting with FP1 */
  const sess=_nrData.sessions.map((s,i)=>({...s,idx:i}))
        .filter(s=>s.dateTime)
        .sort((a,b)=>new Date(a.dateTime)-new Date(b.dateTime));
  if(!sess.length) return;

  /* Which session is live right now? */
  let liveIdx=-1;
  sess.forEach((s,i)=>{
    const start=new Date(s.dateTime);
    const elapsed=now-start;
    if(_sessionActive){
      if(elapsed>=0) liveIdx=i;            /* trust live timing: last started */
    }else if(elapsed>=0 && elapsed<sessMaxDuration(s.name)){
      liveIdx=i;                            /* schedule-based estimate        */
    }
  });

  const dayOpts={weekday:'short',month:'short',day:'numeric'};
  const timeOpts={hour:'2-digit',minute:'2-digit',hour12:false};
  const tz=now.toLocaleTimeString(undefined,{timeZoneName:'short'}).split(' ').pop();

  let html='<div style="display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center">';
  html+='<div style="font-size:.6rem;text-transform:uppercase;letter-spacing:1px;color:#555;padding:2px 0">State</div>';
  html+='<div style="font-size:.6rem;text-transform:uppercase;letter-spacing:1px;color:#555;padding:2px 0">Session</div>';
  html+='<div style="font-size:.6rem;text-transform:uppercase;letter-spacing:1px;color:#555;padding:2px 0;text-align:right">Local time</div>';

  sess.forEach((s,i)=>{
    const dt=new Date(s.dateTime);
    const elapsed=now-dt;
    const isLive=i===liveIdx;
    const isDone=(dt<now && !isLive) || (!_sessionActive && elapsed>=sessMaxDuration(s.name));
    const isSoon=!isDone&&!isLive&&dt>now&&(dt-now)<3600000;
    const isRace=s.name==='Race';
    const isToday=dt.toDateString()===now.toDateString();
    const dayStr=dt.toLocaleDateString(undefined,dayOpts);
    const timeStr=dt.toLocaleTimeString(undefined,timeOpts);

    /* chips */
    let chip='';
    if(isDone) chip='<span style="font-size:.72rem;color:#2ecc71;font-weight:700" title="Finished">✓</span>';
    else if(isLive) chip='<span style="font-size:.6rem;padding:1px 6px;border-radius:8px;background:#063;color:#7dffa0;border:1px solid #2ecc71">● LIVE</span>';
    else if(isSoon) chip='<span style="font-size:.6rem;padding:1px 6px;border-radius:8px;background:#3a2e00;color:#ffc800;border:1px solid #ffc800">SOON</span>';
    else chip='<span style="font-size:.6rem;color:#3a4552">upcoming</span>';

    let nameColor=isLive?'#2ecc71':isDone?'#666':isRace?'#e10600':isSoon?'#ffc800':'#d8dee6';
    let nameWeight=isLive||isRace?'700':'400';
    let timeColor=isLive?'#2ecc71':isDone?'#555':isSoon?'#ffc800':isToday?'#00d2be':'#8f9aa3';
    let rowBg=isLive?'background:#0a2414;border-radius:4px;':'';

    const nameCell='<span style="font-weight:'+nameWeight+';color:'+nameColor+'">'+escHtml(s.name)+'</span>';
    const timeCell=isToday
      ?'<span style="color:'+timeColor+'">'+timeStr+'</span><span style="color:#556;font-size:.6rem"> today</span>'
      :'<span style="color:'+timeColor+'">'+dayStr+' · '+timeStr+'</span>';

    html+='<div style="'+rowBg+'">'+chip+'</div>';
    html+='<div style="font-size:.9rem;'+rowBg+'">'+nameCell+'</div>';
    html+='<div style="font-size:.8rem;text-align:right;font-family:monospace;'+rowBg+'">'+timeCell+'</div>';
  });
  html+='</div>';

  const sourceTxt=_nrData.fromApi
      ?'f1calendar.com (online)'
      :(_nrData.sessions.length>2?'built-in calendar':'built-in calendar — full session list loads online');
  html+='<div style="margin-top:8px;font-size:.62rem;color:#555;border-top:1px solid #222;padding-top:4px">'
       +'Source: '+sourceTxt+' · times shown in your local timezone ('+tz+')</div>';
  cont.innerHTML=html;
}

async function loadNextRace(){
  const errEl=document.getElementById('nrError');
  try{
    let d;
    for(let i=0;i<24;i++){
      d=await(await fetch('/api/nextrace')).json();
      if(!d.loading) break;
      await new Promise(r=>setTimeout(r,1000));
    }
    if(d&&d.loading){errEl.textContent='Still loading calendar…';errEl.style.display='block';return;}
    if(d&&d.error){
      /* Show an error only when we have nothing else to display */
      if(!_nrData){errEl.textContent='Calendar: '+d.error;errEl.style.display='block';}
      return;
    }
    errEl.style.display='none';
    applyNextRace(d);
    /* Refresh periodically: keeps done/live/soon states fresh AND adopts
       the full online schedule once the API fetch lands (the built-in
       fallback only knows FP1 + Race). */
    setInterval(refreshNextRace,30000);
  }catch(e){errEl.textContent='Failed: '+e.message;errEl.style.display='block';}
}

async function refreshNextRace(){
  try{
    const d=await(await fetch('/api/nextrace')).json();
    if(!d||d.loading||d.error||!d.raceName) return;
    const cur=_nrData;
    if(!cur||!cur.raceName){
      document.getElementById('nrError').style.display='none';
      applyNextRace(d);
      return;
    }
    const changed=(cur.raceName!==d.raceName)
      ||(!cur.fromApi&&d.fromApi)
      ||((cur.sessions||[]).length!==(d.sessions||[]).length);
    if(changed) applyNextRace(d); else renderNextRaceSessions();
  }catch(_){/* keep last good data */}
}

/* ── Live Session Events ──────────────────────────────────────────── */
let evTimer=null, lastEvCount=0;
const CAT_COLORS={Track:'#ffc800',Session:'#00d2be',RaceCtrl:'#e10600'};

async function loadEvents(){
  try{
    const d=await(await fetch('/api/events')).json();
    const card=document.getElementById('eventsCard');
    const evts=d.events||[];
    const liveEl=document.getElementById('evLive');
    const statusEl=document.getElementById('evStatus');

    /* Show card if session active/connected or events exist */
    if(!d.active&&!d.connected&&evts.length===0&&!d.sessionEnd){
      card.style.display='none'; return;
    }
    card.style.display='block';

    /* Live badge */
    if(d.active&&d.connected){
      liveEl.style.display='inline';liveEl.style.background='#1a3a1a';liveEl.style.color='#0f0';
    } else if(d.connected){
      liveEl.style.display='inline';liveEl.style.background='#2a2a00';liveEl.style.color='#ffc800';liveEl.textContent='● CONNECTED';
    } else {
      liveEl.style.display='none';
    }
    if(d.active) liveEl.textContent='● LIVE';

    /* Status line */
    let st='';
    if(d.active) st='Session in progress';
    else if(d.sessionEnd>0){
      const endDate=new Date(d.sessionEnd*1000);
      const clearDate=new Date((d.sessionEnd+3600)*1000);
      const timeOpts={hour:'2-digit',minute:'2-digit',hour12:false};
      st='Session ended at '+endDate.toLocaleTimeString(undefined,timeOpts)+' — events clear at '+clearDate.toLocaleTimeString(undefined,timeOpts);
    }
    statusEl.textContent=st;

    /* Event list */
    const listEl=document.getElementById('evList');
    const emptyEl=document.getElementById('evEmpty');
    if(evts.length===0){
      listEl.innerHTML='';emptyEl.style.display='block'; return;
    }
    emptyEl.style.display='none';

    /* Only rebuild if count changed */
    if(evts.length!==lastEvCount){
      lastEvCount=evts.length;
      const timeOpts={hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false};
      let html='';
      /* Show the newest up to 40 events first (full log ring) */
      const maxShow=40;
      const startIdx=evts.length-1;
      const stopIdx=Math.max(-1,evts.length-1-maxShow);
      for(let i=startIdx;i>stopIdx;i--){
        const e=evts[i];
        const t=new Date(e.t*1000);
        const ts=t.toLocaleTimeString(undefined,timeOpts);
        const catCol=CAT_COLORS[e.cat]||'#888';
        html+='<div style="display:flex;gap:8px;align-items:baseline;padding:3px 0;border-bottom:1px solid #222">';
        html+='<span style="font-size:.72rem;color:#555;font-family:monospace;min-width:58px">'+ts+'</span>';
        html+='<span style="font-size:.65rem;padding:1px 5px;border-radius:8px;background:'+catCol+'22;color:'+catCol+';min-width:52px;text-align:center">'+escHtml(e.cat)+'</span>';
        html+='<span style="font-size:.82rem;color:#ccc;flex:1">'+escHtml(e.msg)+'</span>';
        html+='</div>';
      }
      listEl.innerHTML=html;
    }
  }catch(e){/* ignore */}
}

async function clearEvents(){
  await fetch('/api/events/clear',{method:'POST'});
  lastEvCount=0;
  loadEvents();
}

/* Poll events — faster when session active */
function startEventPoll(){
  loadEvents();
  if(evTimer) clearInterval(evTimer);
  evTimer=setInterval(loadEvents,5000);
}
startEventPoll();

/* Startup: poll status (state box, F1 link, race week, effect) and load the
   next-race weekend schedule (kept when the Force State section moved to
   Extras). */
setTimeout(()=>pollStatus(onStatus),300);
setInterval(()=>pollStatus(onStatus),2000);
loadNextRace();
</script>
</body></html>
